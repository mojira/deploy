name: 'Mojira Deploy'
description: 'Deploy Mojira community bots to the Mojira VPS'
inputs:
  vps_host:
    description: "The VPS host's IP address or domain name."
    required: true
  vps_user:
    description: "User name for authentication."
    required: false
    default: "mojira"
  vps_ssh_key:
    description: "Private SSH key to use for connecting."
    required: true
  vps_known_hosts:
    description: "Known Hosts file to use for connecting with SSH."
    required: true
  artifact_paths:
    description: "Paths to artifacts (folders or files) to upload. String with exactly one path per line, and an empty line at the end."
    required: true
  artifact_destination:
    description: "Target folder for artifact upload."
    required: true
  rsync_args:
    description: "Arguments for uploading artifacts via rsync."
    required: false
    default: -avhW --delete
  script:
    description: "Script to run after uploading of artifacts."
    required: false
    default: ""

runs:
  using: 'composite'
  steps:
    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2.8.1
      with:
        key: $VPS_SSH_KEY
        known_hosts: $VPS_KNOWN_HOSTS
    - name: Upload Artifacts
      run: |
        while IFS= read -r ARTIFACT_PATH; do
          echo Uploading artifact $ARTIFACT_PATH...
          ARTIFACT_SLASH_PATH=/$ARTIFACT_PATH
          rsync $RSYNC_ARGS $GITHUB_WORKSPACE/$ARTIFACT_PATH $VPS_USER@$VPS_HOST:$ARTIFACT_DESTINATION${ARTIFACT_SLASH_PATH%/*}
        done < <(printf '%s' "$ARTIFACT_PATHS")
    - name: Run Deploy Script
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: $VPS_HOST
        username: $VPS_USER
        key: $VPS_SSH_KEY
        script: |
          cd $ARTIFACT_DESTINATION
          $SCRIPT

branding:
  color: "green"
  icon: "upload-cloud"
